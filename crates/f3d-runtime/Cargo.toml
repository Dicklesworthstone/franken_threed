[package]
name = "f3d-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Asupersync browser lifecycle and host protocol execution core for FrankenThreeD"

[lints]
workspace = true

[features]
default = ["std", "serde"]
std = ["f3d-core/std"]
serde = ["dep:serde", "dep:serde_json", "f3d-core/serde"]
browser = ["dep:wasm-bindgen", "dep:js-sys", "dep:web-sys"]

[dependencies]
f3d-core = { workspace = true }
asupersync = { path = "../../../../dp/asupersync", default-features = false }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

wasm-bindgen = { version = "0.2.126", optional = true }
js-sys = { version = "0.3.103", optional = true }
web-sys = { version = "0.3.103", optional = true, features = ["Window", "Document", "MessageChannel", "MessagePort"] }

[dev-dependencies]
serde = { workspace = true, features = ["alloc", "derive"] }
serde_json = { workspace = true, features = ["alloc"] }
