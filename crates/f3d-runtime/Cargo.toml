[package]
name = "f3d-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Asupersync browser execution for FrankenThreeD"

[lib]
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[features]
default = []
browser = ["dep:wasm-bindgen", "dep:js-sys", "asupersync/wasm-browser-minimal"]

[dependencies]
# Development linkage while the upstream browser fixes are being verified.
# Absolute path on purpose (root 2283): under RCH the f3d project root canonicalizes to
# /data/projects on the worker, so a relative ../../../../dp path resolved to a different,
# stale /data/dp checkout. RCH syncs this exact physical path. Replace with an immutable pin
# once upstream is ready.
asupersync = { path = "/Users/jemanuel/dp/asupersync", default-features = false }
wasm-bindgen = { version = "=0.2.126", optional = true }
js-sys = { version = "=0.3.103", optional = true }
