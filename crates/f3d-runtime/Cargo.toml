[package]
name = "f3d-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Asupersync browser execution for FrankenThreeD"

[lib]
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[features]
default = []
browser = [
    "dep:wasm-bindgen",
    "dep:js-sys",
    "dep:wasm-bindgen-futures",
    "dep:web-sys",
    "asupersync/wasm-browser-minimal",
]

[dependencies]
# Published browser host/pump implementation; keep the runtime in this Wasm instance.
asupersync = { version = "=0.5.0", default-features = false }
wasm-bindgen = { version = "=0.2.126", optional = true }
js-sys = { version = "=0.3.103", optional = true }
wasm-bindgen-futures = { version = "=0.4.76", optional = true }
web-sys = { version = "=0.3.103", optional = true, features = [
    "AbortController",
    "AbortSignal",
    "ReadableStream",
    "ReadableStreamDefaultReader",
    "RequestInit",
    "Response",
    "Window",
] }
