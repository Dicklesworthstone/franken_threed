name: Marching cubes integration
on:
  push:
    branches: [main]
    paths:
      - 'tools/ingest/**'
      - 'tools/package*.json'
      - 'tests/fixtures/marching_cubes/**'
      - '.github/workflows/marching-cubes.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  numerical-and-addon:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix tools --ignore-scripts
      - uses: actions/checkout@v4
        with:
          repository: mrdoob/three.js
          ref: 148ef33ecb6d2502ff796d4554abd1549c95d519
          path: oracle-three
          persist-credentials: false
      - name: Execute numeric and addon regressions
        shell: bash
        env:
          F3D_THREE_ROOT: ${{ github.workspace }}/oracle-three
        run: |
          node --test tools/ingest/marching_cubes_numeric.test.mjs tools/ingest/marching_cubes_adapter.test.mjs tools/ingest/marching_cubes_bundle.test.mjs | tee marching-cubes-tests.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: marching-cubes-test-log
          path: marching-cubes-tests.log
          retention-days: 7
          if-no-files-found: ignore
