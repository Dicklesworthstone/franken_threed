name: Marching cubes integration
on:
  push:
    branches: [main]
    paths:
      - 'tools/ingest/**'
      - 'tools/package*.json'
      - 'tests/fixtures/marching_cubes/**'
      - '.github/workflows/marching-cubes.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  numerical-and-addon:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix tools --ignore-scripts
      - uses: actions/checkout@v4
        with:
          repository: mrdoob/three.js
          ref: 148ef33ecb6d2502ff796d4554abd1549c95d519
          path: oracle-three
          persist-credentials: false
      - name: Execute numeric, addon and geometry-renderer regressions
        shell: bash
        env:
          F3D_THREE_ROOT: ${{ github.workspace }}/oracle-three
        run: |
          node --test tools/ingest/marching_cubes*.test.mjs tools/ingest/gpu_buffer_geometry*.test.mjs tools/ingest/animation_render*.test.mjs tools/ingest/animation_instanced_render.test.mjs tools/ingest/animation_webgpu_package.test.mjs | tee marching-cubes-tests.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: marching-cubes-test-log
          path: marching-cubes-tests.log
          retention-days: 7
          if-no-files-found: ignore
      - name: Preserve exact numerical test inputs for offline reproduction
        if: always()
        run: |
          tar -czf marching-cubes-repro.tar.gz tools/ingest tools/node_modules tools/package.json tools/package-lock.json tests/fixtures/marching_cubes oracle-three/build oracle-three/src oracle-three/package.json oracle-three/examples/jsm/objects/MarchingCubes.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: marching-cubes-repro
          path: marching-cubes-repro.tar.gz
          retention-days: 7
          if-no-files-found: ignore
