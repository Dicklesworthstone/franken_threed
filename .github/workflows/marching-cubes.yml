name: Marching Cubes Runtime Proof

on:
  push:
  pull_request:

jobs:
  marching-cubes-gate:
    name: Marching Cubes Gate (Rust + JS)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUST_BACKTRACE: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect sibling path dependency contracts
        id: deps
        run: |
          if grep -qE 'path = "\.\./(asupersync|franken_evidence)"' Cargo.toml; then
            echo "needs_sibling_deps=true" >> "$GITHUB_OUTPUT"
          else
            echo "needs_sibling_deps=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout asupersync sibling dependency
        if: steps.deps.outputs.needs_sibling_deps == 'true'
        uses: actions/checkout@v4
        with:
          repository: Dicklesworthstone/asupersync
          path: .ci-deps/asupersync

      - name: Checkout franken_evidence sibling dependency
        if: steps.deps.outputs.needs_sibling_deps == 'true'
        uses: actions/checkout@v4
        with:
          repository: Dicklesworthstone/franken_evidence
          path: .ci-deps/franken_evidence

      - name: Wire sibling path dependencies
        if: steps.deps.outputs.needs_sibling_deps == 'true'
        run: |
          mkdir -p ../asupersync ../franken_evidence
          rsync -a --delete .ci-deps/asupersync/ ../asupersync/
          rsync -a --delete .ci-deps/franken_evidence/ ../franken_evidence/

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install ingest tooling dependencies
        run: npm ci

      - name: Install latest nightly toolchain
        run: |
          rustup toolchain install nightly --profile minimal --component rustfmt --component clippy
          rustup default nightly

      - name: Install wasm target
        run: rustup target add wasm32-unknown-unknown --toolchain nightly

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Run marching-cubes clippy gate
        run: cargo clippy -p f3d-marching-cubes --tests -- -D warnings

      - name: Run marching-cubes kernel tests
        run: cargo test -p f3d-marching-cubes

      - name: Build wasm kernel for JS fast-path checks
        run: cargo build -p f3d-marching-cubes --release --target wasm32-unknown-unknown

      - name: Run marching-cubes runtime gate
        run: node tools/ingest/marching_cubes_gate.mjs

      - name: Run per-triangle material-group transport checks
        run: node --test tools/ingest/frame_driver.test.mjs tools/ingest/marching_cubes_worker_pool.test.mjs tools/ingest/marching_cubes_protocol_v2.test.mjs

      - name: Run source-renderer material-group smoke
        run: node tools/ingest/marching_cubes_material_groups_source_renderer_smoke.mjs

      - name: Verify retained addon typed-array reuse
        run: node --test tools/upstream_retained/upstream/three/test/unit/addons/objects/MarchingCubes.tests.mjs

      - name: Verify material-group docs and measure marker
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          readme = Path("README.md").read_text()
          assert "paper/workflows/marching_cubes_material_groups.md" in readme
          measure = json.loads(Path("paper/curated/measure.json").read_text())
          assert measure["marching_cubes_material_groups_status"] == "Transported. Tests green. Hide-off check passed."
          PY

  gltf-texture-pipeline:
    name: glTF Texture and Export Regression Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run texture selection, upload and offline export tests
        run: >-
          node --test
          tools/ingest/gltf_webp.test.mjs
          tools/ingest/gltf_webp_pipeline.test.mjs
          tools/ingest/gltf_image_decode.test.mjs
          tools/ingest/animation_model.test.mjs
