<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>FrankenThreeD HDR render targets and canvas output</title>
<style>body { font: 16px system-ui; margin: 2rem; } canvas { margin: 1rem; border: 1px solid; } pre { white-space: pre-wrap; }</style>
<h1>Native HDR target and canvas probe</h1>
<p>Serve the repository root on localhost or HTTPS with the pinned Three.js build.
This checks actual half-float readback and native canvas pixels, not performance.
A missing WebGPU adapter is blocked, never passed.</p>
<pre id="status">Running…</pre><div id="canvases"></div>
<script type="module">
import {createGpuRenderTarget} from '../../../tools/ingest/gpu_render_target.mjs';
import {createGpuThreeHdrCanvas} from '../../../tools/ingest/three_canvas.mjs';
const log = [], assert = (ok, message) => { if (!ok) throw new Error(message); };
async function radiance(device, sampleCount) {
  const target = createGpuRenderTarget(device, {width: 4, height: 4, sampleCount, depthFormat: null});
  let buffer;
  try {
    await target.whenIdle();
    device.pushErrorScope('validation');
    let validation;
    try {
      buffer = device.createBuffer({size: 256, usage: GPUBufferUsage.COPY_DST | GPUBufferUsage.MAP_READ});
      target.withFrame((frame, texture) => {
        const encoder = device.createCommandEncoder();
        const pass = encoder.beginRenderPass({colorAttachments: [{view: frame.colorView,
          ...(frame.resolveTarget ? {resolveTarget: frame.resolveTarget} : {}),
          loadOp: 'clear', storeOp: 'store', clearValue: [2, 0.5, 0.25, 1]}]});
        pass.end();
        encoder.copyTextureToBuffer({texture}, {buffer, bytesPerRow: 256}, [1, 1]);
        device.queue.submit([encoder.finish()]);
      });
    } finally { validation = device.popErrorScope(); }
    const invalid = await validation; assert(!invalid, invalid?.message);
    await buffer.mapAsync(GPUMapMode.READ);
    const data = new DataView(buffer.getMappedRange()), values = [0, 2, 4, 6].map(o => data.getUint16(o, true));
    assert(values.every((v, i) => v === [0x4000, 0x3800, 0x3400, 0x3c00][i]),
      `${sampleCount}x offscreen HDR/resolve lost radiance: ${values}`);
    buffer.unmap(); await target.whenIdle();
    log.push({case: `${sampleCount}x native half-float HDR resolve`, values});
  } finally { buffer?.destroy(); target.dispose(); }
}
function expect(canvas, expected, label) {
  // Capture in the submitting host turn; presentation textures are ephemeral.
  const copy = document.createElement('canvas'); copy.width = canvas.width; copy.height = canvas.height;
  const context = copy.getContext('2d', {willReadFrequently: true}); context.drawImage(canvas, 0, 0);
  const value = [...context.getImageData(Math.floor(canvas.width / 2), Math.floor(canvas.height / 2), 1, 1).data];
  assert(expected.every((n, i) => Math.abs(value[i] - n) <= 3) && value[3] === 255, `${label}: ${value}, expected ${expected}`);
  log.push({case: label, value});
}
async function run() {
  if (!navigator.gpu) return {status: 'blocked', reason: 'WebGPU unavailable'};
  const adapter = await navigator.gpu.requestAdapter();
  if (!adapter) return {status: 'blocked', reason: 'No WebGPU adapter'};
  const device = await adapter.requestDevice();
  try {
    const THREE = await import('../../../upstream/three.js/build/three.core.js');
    assert(THREE.REVISION === '186', 'Pinned r186 source is required');
    for (const sampleCount of [1, 4]) {
      await radiance(device, sampleCount);
      const canvas = document.createElement('canvas'); canvas.width = canvas.height = 64;
      document.querySelector('#canvases').append(canvas);
      const scene = new THREE.Scene(); scene.background = new THREE.Color(0, 0, 0);
      const geometry = new THREE.PlaneGeometry(1, 1);
      const material = new THREE.MeshLambertMaterial({color: 0, emissive: 0xffffff, emissiveIntensity: 4});
      scene.add(new THREE.Mesh(geometry, material));
      const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 10); camera.position.z = 2;
      let renderer;
      try {
        renderer = await createGpuThreeHdrCanvas(canvas, scene, {device, three: THREE,
          renderTarget: {sampleCount}, output: {toneMapping: 'reinhard'},
          scene: {maxBindings: 4, renderer: {maxDraws: 16, renderBundles: true}}});
        renderer.render(camera); expect(canvas, [231, 231, 231], `${sampleCount}x radiance 4 mapped before clipping`);
        await renderer.whenIdle();
        renderer.render(camera, {output: {exposure: 0.25}});
        expect(canvas, [188, 188, 188], `${sampleCount}x current exposure`); await renderer.whenIdle();
        renderer.resize(96, 80); renderer.render(camera);
        expect(canvas, [231, 231, 231], `${sampleCount}x resized target and default exposure`); await renderer.whenIdle();
        material.emissiveIntensity = 0.25;
        renderer.render(camera, {output: {toneMapping: 'none', exposure: 8}});
        expect(canvas, [137, 137, 137], `${sampleCount}x one sRGB transfer, NoToneMapping ignores exposure`);
        await renderer.whenIdle();
        renderer.resize(0, 80); renderer.render(camera);
        assert(renderer.suspended && !renderer.lastFrameRendered, 'Zero-size canvas must skip both passes');
        renderer.setSize(32, 24, 2); renderer.render(camera, {output: {toneMapping: 'none'}});
        expect(canvas, [137, 137, 137], `${sampleCount}x resumed HDR output`); await renderer.whenIdle();
        assert(renderer.diagnostics.renderer.hdr.retiredTargets === 0, 'Idle must retire HDR targets');
      } finally { renderer?.dispose(); geometry.dispose(); material.dispose(); }
    }
    return {status: 'passed', log, accelerationClaim: false};
  } finally { device.destroy(); }
}
try { window.__f3dHdrCanvasResult = await run(); }
catch (error) { window.__f3dHdrCanvasResult = {status: 'failed', error: String(error.stack ?? error), log}; }
document.querySelector('#status').textContent = JSON.stringify(window.__f3dHdrCanvasResult, null, 2);
</script>
</html>
