<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>FrankenThreeD - WebGPU Bridge Counterexample Suite</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 24px;
      background: #0d1117;
      color: #c9d1d9;
      line-height: 1.5;
    }
    h1 { color: #58a6ff; font-size: 22px; margin-bottom: 8px; }
    p { color: #8b949e; font-size: 14px; margin-top: 0; }
    .status-box {
      margin-top: 16px;
      padding: 16px;
      border-radius: 8px;
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
      font-size: 13px;
    }
    .running { background: #161b22; border: 1px solid #30363d; color: #58a6ff; }
    .pass { background: #0d2818; border: 1px solid #238636; color: #3fb950; }
    .fail { background: #2c0f12; border: 1px solid #da3633; color: #f85149; }
    .test-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 16px;
      margin-top: 20px;
    }
    .test-card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 14px;
    }
    .test-card h3 { margin: 0 0 8px 0; font-size: 14px; }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
    }
    .badge-pass { background: #238636; color: #fff; }
    .badge-fail { background: #da3633; color: #fff; }
    .badge-running { background: #1f6feb; color: #fff; }
    .badge-pending { background: #9e6a03; color: #fff; }
    canvas {
      border: 1px solid #30363d;
      margin-top: 10px;
      image-rendering: pixelated;
      width: 64px;
      height: 64px;
    }
  </style>
</head>
<body>
  <h1>f3d-05.7: WebGPU Bridge Counterexample Suite</h1>
  <p>Verifying first-frame pixel equivalence, queue snapshot isolation, opcode bounds enforcement, and synchronous error scopes against real GPU execution and direct-JS references.</p>

  <div id="statusBox" class="status-box running">Initializing WebGPU bridge and executing counterexamples...</div>

  <div id="testGrid" class="test-grid"></div>

  <script type="module">
    import { WebGpuBridgeHost } from "../../fixtures/gpu_bridge/bridge_runtime.js";
    import {
      testFirstFramePixelEquivalence,
      testNegativeBrokenFirstFrameGpuTransform,
      testRedABlueBQueueWriteSnapshot,
      testNegativeBrokenRedABlueBQueueHazard,
      testNegativeMissingWasmRejection,
      testMalformedPacketBoundsChecking,
      testNegativeBrokenMalformedPacket,
      testSynchronousErrorScopeDiscipline,
      testNegativeBrokenErrorScopeControl,
      testStaleEpochReadbackPublicationGate,
      testBundleThenDirectDrawStateReset,
      testNegativeBrokenBundleDirectDraw,
      testGenerationalHandleAbaPublication,
      testNegativeBrokenGenerationalHandlePublication,
      testLinearMemoryBorrowGuards,
      testNegativeBrokenLinearMemoryBorrowGuard,
      testAffineRowsGpuLayoutValidation,
      testNegativeBrokenAffineRowsGpuPacketRejection,
      getPendingBridgeCapabilities,
    } from "./counterexample_suite.js";

    const statusBox = document.getElementById("statusBox");
    const testGrid = document.getElementById("testGrid");

    const report = {
      passed: false,
      timestamp: new Date().toISOString(),
      userAgent: navigator.userAgent,
      deviceInfo: null,
      wasmLoaded: false,
      suiteResults: {},
      pendingCapabilities: {},
      errors: [],
    };

    function addCard(id, title, description, ownership = null) {
      const card = document.createElement("div");
      card.className = "test-card";
      card.id = `card-${id}`;
      const ownershipBadge = ownership
        ? `<span style="font-size:10px; padding:2px 6px; border-radius:4px; margin-right:8px; font-weight:600; ${ownership.startsWith('AUTHORITATIVE') ? 'background:#1f6feb33; color:#58a6ff; border:1px solid #1f6feb' : (ownership.includes('PENDING') ? 'background:#9e6a0333; color:#d29922; border:1px solid #9e6a03' : 'background:#30363d; color:#8b949e; border:1px solid #484f58')}">${ownership}</span>`
        : '';
      card.innerHTML = `
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <h3 style="margin:0; font-size:14px;">${title}</h3>
          <div>
            ${ownershipBadge}
            <span class="badge badge-running" id="badge-${id}">RUNNING</span>
          </div>
        </div>
        <div style="font-size:12px; color:#8b949e; margin:6px 0;">${description}</div>
        <div style="font-size:12px; font-family:monospace;" id="detail-${id}">Executing...</div>
      `;
      testGrid.appendChild(card);
    }

    function updateCard(name, status, detail) {
      const badge = document.getElementById(`badge-${name}`);
      const detailEl = document.getElementById(`detail-${name}`);
      if (status === "PASS") {
        badge.className = "badge badge-pass";
        badge.textContent = "PASS";
        detailEl.style.color = "#3fb950";
        detailEl.textContent = detail || "Assertion verified successfully.";
      } else if (status === "PENDING") {
        badge.className = "badge badge-pending";
        badge.textContent = "PENDING";
        detailEl.style.color = "#d29922";
        detailEl.textContent = detail || "Pending product implementation.";
      } else {
        badge.className = "badge badge-fail";
        badge.textContent = "FAIL";
        detailEl.style.color = "#f85149";
        detailEl.textContent = detail || "Test assertion failed.";
      }
    }

    async function runSuite() {
      try {
        if (!navigator.gpu) {
          throw new Error("WebGPU is not supported in this browser environment");
        }

        // Require compiled application Wasm module. No silent fallback allowed.
        let wasmModule = null;
        try {
          const wasm = await import("/pkg/f3d_runtime.js");
          await wasm.default();
          const buildTriangleFn = wasm.f3d_build_first_frame_packet || wasm.gpu_bridge_build_triangle_packet;
          const buildRedBlueFn = wasm.f3d_build_red_a_blue_b_packet || wasm.gpu_bridge_build_red_blue_packet;
          const tryPublishFn = wasm.f3d_try_publish_readback || wasm.gpu_bridge_try_publish_readback;
          const buildBundleDirectFn = wasm.f3d_build_bundle_direct_draw_packet || wasm.gpu_bridge_build_bundle_direct_draw_packet;
          const checkHandleFn = wasm.f3d_check_resource_handle || wasm.gpu_bridge_check_resource_handle;
          const advanceGenFn = wasm.f3d_advance_resource_generation || wasm.gpu_bridge_advance_resource_generation;
          const borrowEnterFn = wasm.f3d_borrow_enter || wasm.gpu_bridge_borrow_enter;
          const borrowExitFn = wasm.f3d_borrow_exit || wasm.gpu_bridge_borrow_exit;
          const tryGrowMemoryFn = wasm.f3d_try_grow_memory || wasm.gpu_bridge_try_grow_memory;
          const validateAffineFn = wasm.f3d_validate_affine_rows || wasm.gpu_bridge_validate_affine_rows;
          if (
            typeof buildTriangleFn !== "function" ||
            typeof buildRedBlueFn !== "function" ||
            typeof tryPublishFn !== "function" ||
            typeof buildBundleDirectFn !== "function" ||
            typeof checkHandleFn !== "function" ||
            typeof advanceGenFn !== "function" ||
            typeof borrowEnterFn !== "function" ||
            typeof borrowExitFn !== "function" ||
            typeof tryGrowMemoryFn !== "function" ||
            typeof validateAffineFn !== "function"
          ) {
            throw new Error(
              `Compiled application Wasm at /pkg/f3d_runtime.js is missing required exports: ` +
              `buildTriangleFn=${typeof buildTriangleFn}, buildRedBlueFn=${typeof buildRedBlueFn}, tryPublishFn=${typeof tryPublishFn}, ` +
              `buildBundleDirectFn=${typeof buildBundleDirectFn}, checkHandleFn=${typeof checkHandleFn}, advanceGenFn=${typeof advanceGenFn}, ` +
              `borrowEnterFn=${typeof borrowEnterFn}, borrowExitFn=${typeof borrowExitFn}, tryGrowMemoryFn=${typeof tryGrowMemoryFn}, validateAffineFn=${typeof validateAffineFn}`
            );
          }
          wasmModule = wasm;
          report.wasmLoaded = true;
          console.log("[f3d-05.7] Real compiled application Wasm loaded successfully:", Object.keys(wasm));
        } catch (wasmErr) {
          report.wasmLoaded = false;
          const errMsg = `Wasm Load Failure: Required compiled application Wasm (/pkg/f3d_runtime.js) failed to load: ${wasmErr.message || String(wasmErr)}. Silent JS fallback is strictly forbidden.`;
          report.errors.push(errMsg);
          throw new Error(errMsg);
        }

        const host = new WebGpuBridgeHost();
        const capRecord = await host.negotiateAndCreateDevice({
          powerPreference: "high-performance",
          requiredFeatures: [],
        });
        report.deviceInfo = capRecord;

        // Configure a real WebGPU canvas context for TARGET_CANVAS passes authored in Rust/Wasm
        const canvas = document.createElement("canvas");
        canvas.id = "webgpu-swapchain-canvas";
        canvas.width = 64;
        canvas.height = 64;
        canvas.style.display = "none";
        document.body.appendChild(canvas);

        const canvasContext = canvas.getContext("webgpu");
        if (canvasContext) {
          const preferredFormat = capRecord.preferredCanvasFormat ||
            (navigator.gpu && navigator.gpu.getPreferredCanvasFormat ? navigator.gpu.getPreferredCanvasFormat() : "bgra8unorm");
          canvasContext.configure({
            device: host.device,
            format: preferredFormat,
            alphaMode: "premultiplied",
          });
        }

        const activeTests = [
          {
            id: "pixel_equivalence",
            title: "1. First-Frame Pixel Equivalence",
            ownership: "AUTHORITATIVE (05.7)",
            desc: "Candidate bridge vs direct-JS oracle reference (0 differences) + real GPU broken transform rejection",
            run: async () => {
              const { candidatePixels, oraclePixels } = await testFirstFramePixelEquivalence(
                host,
                host.device,
                wasmModule,
                64,
                64,
                canvasContext
              );
              await testNegativeBrokenFirstFrameGpuTransform(host, oraclePixels, 64, 64);
              return "Verified via real Rust/Wasm binary packet (0 diffs); real GPU broken transform rejected.";
            },
          },
          {
            id: "queue_snapshot_red_a_blue_b",
            title: "2. Red-A / Blue-B Queue Snapshot",
            ownership: "AUTHORITATIVE (05.7)",
            desc: "Single submission schedule with PerUseByteBuffer slices + real GPU queue hazard rejection",
            run: async () => {
              await testRedABlueBQueueWriteSnapshot(host, wasmModule, 64, 64);
              await testNegativeBrokenRedABlueBQueueHazard(host, wasmModule, 32, 32);
              return "Target A pure Red, Target B pure Blue (Rust PerUseByteBuffer); GPU queue hazard rejected.";
            },
          },
          {
            id: "missing_wasm_rejection",
            title: "3. Missing-Wasm / Export Rejection Control",
            ownership: "AUTHORITATIVE (05.7)",
            desc: "Verifies test runner demonstrably rejects runs when application Wasm or required exports are missing",
            run: async () => {
              await testNegativeMissingWasmRejection(host, host.device);
              return "Confirmed: Runner strictly rejects execution when Wasm or required exports are missing.";
            },
          },
          {
            id: "malformed_packet_bounds",
            title: "4. Malformed Packet & Opcode Bounds Enforcement",
            ownership: "SMOKE CHECK (05.6 Owned)",
            desc: "Valid packet parses; truncated opcode fields and invalid format/target codes strictly rejected",
            run: async () => {
              await testMalformedPacketBoundsChecking(host);
              await testNegativeBrokenMalformedPacket(host);
              return "Well-formed packet parsed; truncated opcodes and invalid formats/targets strictly rejected.";
            },
          },
          {
            id: "error_scope_synchronous_submit",
            title: "5. Synchronous Error-Scope Stack & Submit Discipline",
            ownership: "SMOKE CHECK (05.6 Owned)",
            desc: "finish/submit execute synchronously within error scopes; promise yields and interleaving rejected",
            run: async () => {
              await testSynchronousErrorScopeDiscipline(host);
              await testNegativeBrokenErrorScopeControl(host);
              return "Synchronous submit verified inside scopes; async yields and interleaving rejected.";
            },
          },
          {
            id: "stale_epoch_publication_gate",
            title: "6. Stale-Epoch Readback Publication Gate",
            ownership: "AUTHORITATIVE (05.7)",
            desc: "Rust Wasm publication gate (58j.3): real bridge readback epoch verified against advancing region epoch",
            run: async () => {
              return await testStaleEpochReadbackPublicationGate(host, wasmModule);
            },
          },
          {
            id: "bundle_then_direct_draw_state_reset",
            title: "7. Bundle-Then-Direct-Draw State Reset",
            ownership: "AUTHORITATIVE (05.7)",
            desc: "WebGPU spec state reset after executeBundles: bundle green + direct blue rebind vs direct-JS oracle + omitted rebind rejection",
            run: async () => {
              const { candidatePixels, oraclePixels } = await testBundleThenDirectDrawStateReset(
                host,
                host.device,
                wasmModule,
                64,
                64
              );
              const brokenResult = await testNegativeBrokenBundleDirectDraw(host, oraclePixels, 64, 64);
              return `Verified via real Rust/Wasm bundle packet (0 diffs vs oracle); post-bundle draw without rebind rejected (${brokenResult.behavior}).`;
            },
          },
          {
            id: "generational_handle_aba_publication",
            title: "8. Generational Handle ABA Publication Gate",
            ownership: "AUTHORITATIVE (05.7)",
            desc: "Rust Wasm generational handle slot table (§6.5): fresh gen verified, advance simulated, stale ABA handle and zero generation strictly rejected",
            run: async () => {
              const res = await testGenerationalHandleAbaPublication(host, wasmModule);
              const broken = await testNegativeBrokenGenerationalHandlePublication(host, wasmModule, 10, 1);
              return `Verified via real Rust/Wasm handle exports (fresh gen accepted, advanced gen verified); stale publication attempt rejected (${broken.behavior}).`;
            },
          },
          {
            id: "linear_memory_borrow_guards",
            title: "9. Linear Memory Borrow Guards",
            ownership: "AUTHORITATIVE (05.7)",
            desc: "Rust Wasm BorrowScope token validation (§6.6, §13.1): idle growth allowed, in-borrow growth blocked, token mismatch rejected, clean exit restored",
            run: async () => {
              const res = await testLinearMemoryBorrowGuards(host, wasmModule);
              const broken = await testNegativeBrokenLinearMemoryBorrowGuard(host, wasmModule);
              return `Verified via real Rust/Wasm borrow scope exports (token=${res.token}); in-borrow growth attempt rejected (${broken.behavior}).`;
            },
          },
          {
            id: "affine_rows_gpu_layout_validation",
            title: "10. AffineRows GPU Wire Layout Validation",
            ownership: "AUTHORITATIVE (05.7)",
            desc: "Rust Wasm AffineRows wire layout validator (§6.1, §6.2): 64-byte identity/translated accepted (0), 48-byte translation accepted (0), NaN translation rejected (2), e[11] perspective rejected (2), 47/56-byte rejected (1), 72-byte rejected (4), non-affine packet refused before GPU submission",
            run: async () => {
              const res = await testAffineRowsGpuLayoutValidation(host, wasmModule);
              const broken = await testNegativeBrokenAffineRowsGpuPacketRejection(host, wasmModule);
              return `Verified via real Rust/Wasm validator: 64-byte identity/translated (0), 48-byte translation (0) / NaN (2), e[11] perspective (2), 47/56-byte (1), 72-byte (4); non-affine GPU upload refused (${broken.behavior}).`;
            },
          },
        ];

        let allPassed = true;

        for (const t of activeTests) {
          addCard(t.id, t.title, t.desc, t.ownership);
          try {
            const detail = await t.run();
            report.suiteResults[t.id] = { status: "PASS", detail, ownership: t.ownership };
            updateCard(t.id, "PASS", detail);
          } catch (err) {
            allPassed = false;
            report.suiteResults[t.id] = { status: "FAIL", error: err.message || String(err), ownership: t.ownership };
            report.errors.push(`${t.id}: ${err.message || String(err)}`);
            updateCard(t.id, "FAIL", err.message || String(err));
          }
        }

        // Record pending product capabilities (never fake as passed)
        const pendingCapabilities = getPendingBridgeCapabilities();
        for (const p of pendingCapabilities) {
          addCard(p.capability, p.capability, p.reason, "PENDING KILL-GATE");
          updateCard(p.capability, "PENDING", p.reason);
          report.pendingCapabilities[p.capability] = p;
        }

        report.partition = {
          authoritativeSuites: [
            "pixel_equivalence",
            "queue_snapshot_red_a_blue_b",
            "missing_wasm_rejection",
            "stale_epoch_publication_gate",
            "bundle_then_direct_draw_state_reset",
            "generational_handle_aba_publication",
            "linear_memory_borrow_guards",
            "affine_rows_gpu_layout_validation",
          ],
          smokeChecksOwnedBy05_6: ["malformed_packet_bounds", "error_scope_synchronous_submit"],
          pendingCapabilities: pendingCapabilities.map(p => p.capability),
        };

        report.passed = allPassed;

        if (allPassed) {
          statusBox.className = "status-box pass";
          statusBox.innerHTML = `<strong>ALL 10 ACTIVE BRIDGE SUITES PASSED VERIFICATION</strong><br>` +
            `<span style="color:#7ee787;">• <strong>8 Authoritative Suites (05.7):</strong> First-Frame Pixel Equivalence (dual control vs oracle + real GPU broken transform rejection), Red-A/Blue-B Queue Snapshot (PerUseByteBuffer vs real GPU hazard rejection), Missing-Wasm Rejection Control, Stale-Epoch Readback Publication Gate (real Rust Wasm export), Bundle-Then-Direct-Draw State Reset (Rust bundle packet vs direct-JS oracle + omitted rebind rejection), Generational Handle ABA Publication Gate (Rust slot table vs stale ABA handle rejection), Linear Memory Borrow Guards (BorrowScope token validation vs in-borrow growth rejection), AffineRows GPU Wire Layout Validation (AffineRows::from_column_major validator vs non-affine GPU upload refusal).</span><br>` +
            `<span style="color:#8b949e;">• <strong>2 Duplicated Smoke Checks:</strong> Malformed Packet Bounds and Synchronous Error-Scope Discipline (retained locally; authoritatively owned by 05.6 gpu_bridge_test.html).</span><br>` +
            `<span style="color:#3fb950;">• <strong>Pending Kill-Gate Ledger: ZERO PENDING ITEMS</strong> (all 10 bridge capabilities authoritatively verified against real Rust/Wasm product exports).</span>`;
        } else {
          statusBox.className = "status-box fail";
          statusBox.innerHTML = `<strong>COUNTEREXAMPLE SUITE FAILED:</strong> ${report.errors.join("; ")}`;
        }
      } catch (fatal) {
        report.passed = false;
        report.errors.push(`Fatal suite error: ${fatal.message || String(fatal)}`);
        statusBox.className = "status-box fail";
        statusBox.innerHTML = `<strong>FATAL ERROR:</strong> ${fatal.message || String(fatal)}`;
      }

      // Send report to server if available
      try {
        await fetch("/report", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(report),
        });
      } catch (_) {
        // Standalone browser execution outside test runner harness
      }
    }

    runSuite();
  </script>
</body>
</html>
