<!DOCTYPE html><html lang="en"><meta charset="utf-8"><title>Native integer storage copies</title>
<body><pre id="result">Running…</pre><script type="module">
// Serve the repository root over localhost. Real WebGPU textureStore/load and
// copy commands with minimal source objects, not a full r186/TSL parity test.
import {createThreeStorageTextures} from '../../../tools/ingest/three_storage_textures.mjs';
import {withStorageTextureCopies} from '../../../tools/ingest/three_storage_texture_copy.mjs';
const THREE = {NoColorSpace: '', LinearSRGBColorSpace: 'srgb-linear', UnsignedByteType: 1009, HalfFloatType: 1016,
  FloatType: 1015, IntType: 1013, UnsignedIntType: 1014, RedFormat: 1028, RGFormat: 1030, RGBAFormat: 1023,
  RedIntegerFormat: 1029, RGIntegerFormat: 1031, RGBAIntegerFormat: 1033, NearestFilter: 1003, LinearFilter: 1006,
  NearestMipmapNearestFilter: 1004, NearestMipmapLinearFilter: 1005, LinearMipmapNearestFilter: 1007,
  LinearMipmapLinearFilter: 1008, ClampToEdgeWrapping: 1001, RepeatWrapping: 1000, MirroredRepeatWrapping: 1002};
THREE.Texture = class extends EventTarget {
  constructor(type, format, dimension) {
    super(); Object.assign(this, {isStorageTexture: true, type, format, colorSpace: '', image: {width: 4, height: 2},
      generateMipmaps: true, mipmapsAutoUpdate: false, mipmaps: [], version: 0, source: {version: 0},
      magFilter: THREE.NearestFilter, minFilter: THREE.NearestFilter, anisotropy: 1,
      wrapS: 1001, wrapT: 1001, wrapR: 1001});
    if (dimension !== '2d') this.image.depth = 3;
    if (dimension === '3d') this.is3DTexture = true;
    if (dimension === '2d-array') this.isArrayTexture = true;
  }
  dispose() { this.dispatchEvent(new Event('dispose')); }
};
const state = window.__f3dIntegerCopy = {status: 'running', owner: 'new-webgpu', checks: [], error: null};
let device, owner;
const resources = new Set();
const keep = resource => { resources.add(resource); return resource; };
const expectedBits = [0xffffffff, 0x80000000, 0x01000001, 0x7fffffff];
function equal(name, actual, expected) {
  if (actual.length !== expected.length || actual.some((n, i) => n !== expected[i])) throw new Error(name + ': integer data mismatch');
  state.checks.push(name);
}
function pipeline(code, entries) {
  const module = device.createShaderModule({code});
  const layout = device.createBindGroupLayout({entries: entries.map((layout, binding) => ({binding, visibility: 4, ...layout}))});
  return device.createComputePipeline({layout: device.createPipelineLayout({bindGroupLayouts: [layout]}), compute: {module, entryPoint: 'main'}});
}
function dispatch(pipeline, bindings, size) {
  const group = device.createBindGroup({layout: pipeline.getBindGroupLayout(0), entries: bindings.map((resource, binding) => ({binding, resource}))});
  const encoder = device.createCommandEncoder(), pass = encoder.beginComputePass();
  pass.setPipeline(pipeline); pass.setBindGroup(0, group); pass.dispatchWorkgroups(...size); pass.end();
  device.queue.submit([encoder.finish()]);
}
async function read(texture, signed, dimension, level = 0) {
  const input = owner.captureBinding({texture, isSampledTexture: true});
  const shape = input.entry.shape, w = Math.max(1, shape.width >> level), h = Math.max(1, shape.height >> level);
  const d = dimension === '3d' ? Math.max(1, shape.depth >> level) : shape.depth, count = w * h * d;
  const output = keep(device.createBuffer({size: count * 16, usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_SRC}));
  const staging = keep(device.createBuffer({size: count * 16, usage: GPUBufferUsage.COPY_DST | GPUBufferUsage.MAP_READ}));
  const uv = dimension === '3d' ? 'vec3i(id)' : dimension === '2d-array' ? 'vec2i(id.xy), i32(id.z)' : 'vec2i(id.xy)';
  const kind = dimension === '2d-array' ? '2d_array' : dimension;
  const code = `@group(0) @binding(0) var source: texture_${kind}<${signed ? 'i32' : 'u32'}>;
@group(0) @binding(1) var<storage, read_write> result: array<vec4u>;
@compute @workgroup_size(1) fn main(@builtin(global_invocation_id) id: vec3u) {
  let value = textureLoad(source, ${uv}, ${level});
  result[(id.z * ${h}u + id.y) * ${w}u + id.x] = ${signed ? 'bitcast<vec4u>(value)' : 'value'};
}`;
  device.pushErrorScope('validation');
  dispatch(pipeline(code, [owner.layout(input), {buffer: {type: 'storage'}}]), [owner.resolve(input), {buffer: output}], [w, h, d]);
  const encoder = device.createCommandEncoder(); encoder.copyBufferToBuffer(output, 0, staging, 0, count * 16);
  device.queue.submit([encoder.finish()]);
  const validation = device.popErrorScope();
  await staging.mapAsync(GPUMapMode.READ);
  const failure = await validation; if (failure) throw new Error(failure.message);
  const result = Array.from(new Uint32Array(staging.getMappedRange().slice()));
  staging.unmap(); staging.destroy(); output.destroy(); resources.delete(staging); resources.delete(output);
  return result;
}
try {
  if (!navigator.gpu) throw new Error('WebGPU unavailable');
  const adapter = await navigator.gpu.requestAdapter(); if (!adapter) throw new Error('No WebGPU adapter');
  device = await adapter.requestDevice();
  state.adapter = {vendor: adapter.info?.vendor, architecture: adapter.info?.architecture, device: adapter.info?.device};
  owner = createThreeStorageTextures(THREE, {getDevice: () => device});
  class Base {
    constructor() { this.isWebGPURenderer = this._initialized = true; this._storageTextures = owner; }
    async waitForGPU() { await owner.whenIdle(); }
  }
  const renderer = new (withStorageTextureCopies(Base))();
  for (const dimension of ['2d', '2d-array', '3d']) for (const signed of [false, true])
    for (const [format, channels] of [[THREE.RedIntegerFormat, 1], [THREE.RGIntegerFormat, 2], [THREE.RGBAIntegerFormat, 4]]) {
      const source = new THREE.Texture(signed ? THREE.IntType : THREE.UnsignedIntType, format, dimension);
      const destination = new THREE.Texture(source.type, format, dimension);
      const write = owner.captureBinding({texture: source, isSampledTexture: true, store: true, access: 'writeOnly'});
      const view = owner.resolve(write), shape = write.entry.shape, kind = dimension === '2d-array' ? '2d_array' : dimension;
      const uv = dimension === '3d' ? 'vec3i(id)' : dimension === '2d-array' ? 'vec2i(id.xy), i32(id.z)' : 'vec2i(id.xy)';
      const code = `@group(0) @binding(0) var result: texture_storage_${kind}<${shape.format}, write>;
@compute @workgroup_size(1) fn main(@builtin(global_invocation_id) id: vec3u) {
  let value = vec4u(0xffffffffu, 0x80000000u, 0x01000001u, 0x7fffffffu);
  textureStore(result, ${uv}, ${signed ? 'bitcast<vec4i>(value)' : 'value'});
}`;
      device.pushErrorScope('validation');
      dispatch(pipeline(code, [owner.layout(write)]), [view], [4, 2, shape.depth]); owner.written([write]);
      renderer.copyTextureToTexture(source, destination);
      const validation = await device.popErrorScope(); if (validation) throw new Error(validation.message);
      const label = `${shape.format}/${dimension}`;
      const expectedPixel = expectedBits.map((n, i) => i < channels ? n : i === 3 ? 1 : 0);
      equal(label + '/full', await read(destination, signed, dimension), Array.from({length: 8 * shape.depth}, () => expectedPixel).flat());
      // Explicit mip copy: no integer averaging or float conversion is legal.
      const region = {isBox3: true, min: {x: 0, y: 0, z: 0}, max: {x: 2, y: 1, z: dimension === '3d' ? 1 : shape.depth}};
      renderer.copyTextureToTexture(source, destination, region, null, 0, 1);
      equal(label + '/mip', await read(destination, signed, dimension, 1), Array.from({length: 2 * region.max.z}, () => expectedPixel).flat());
      await renderer.waitForGPU(); source.dispose(); destination.dispose();
    }
  state.status = 'pass';
} catch (error) { state.status = 'fail'; state.error = error.stack ?? String(error); }
finally {
  for (const resource of resources) resource.destroy();
  owner?.dispose(); device?.destroy();
  document.querySelector('#result').textContent = JSON.stringify(state, null, 2);
}
</script></body></html>
