<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>F3D TSL storage texture integration</title></head>
<body><canvas width="16" height="16"></canvas><pre id="result">Running…</pre>
<!-- Build with the pinned upstream checkout and ingest dependencies installed:
node tools/ingest/cli.mjs tests/e2e/webgpu_renderer/storage_compute.html --build-app /tmp/f3d-storage-compute --route-webgpu-renderer
Serve the output on localhost and open storage_compute.html in a WebGPU browser.
This fixture checks actual GPU results, not throughput. It must not pass through
retained renderer submission. Automation can await __f3dStorageCompute.status. -->
<script type="importmap">{"imports":{"three":"../../../upstream/three.js/build/three.webgpu.js","three/webgpu":"../../../upstream/three.js/build/three.webgpu.js","three/tsl":"../../../upstream/three.js/build/three.tsl.js"}}</script>
<script type="module">
import * as THREE from 'three/webgpu';
import {Fn, instanceIndex, uvec2, vec4, float, storage, textureLoad, textureStore, uniform} from 'three/tsl';

const state = window.__f3dStorageCompute = {status: 'running', checks: [], error: null};
let renderer;
const resources = [];
const own = value => { resources.push(value); return value; };
function check(name, actual, expected) {
  if (actual.length !== expected.length || actual.some((value, i) => !Number.isFinite(value) || Math.abs(value - expected[i]) > 0.00001))
    throw new Error(`${name}: expected ${JSON.stringify(expected)}, got ${JSON.stringify(actual)}`);
  state.checks.push(name);
}
try {
  renderer = new THREE.WebGPURenderer({canvas: document.querySelector('canvas')});
  if (renderer.isF3DRenderer !== true && !new URL(location.href).searchParams.has('reference'))
    throw new Error('Build this fixture with --route-webgpu-renderer (or request the explicit reference run)');
  await renderer.init();

  // A non-square extent and partial workgroup exercise integer coordinates and
  // the source-generated tail guard. Float32 values must not become RGBA8/16F.
  const width = 7, height = 3, count = width * height;
  const image = own(new THREE.StorageTexture(width, height));
  image.type = THREE.FloatType;
  image.format = THREE.RedFormat;
  image.minFilter = image.magFilter = THREE.NearestFilter;
  const output = new THREE.StorageBufferAttribute(new Float32Array(count), 1);
  const values = storage(output, 'float', count);
  const produce = own(Fn(() => {
    const coord = uvec2(instanceIndex.mod(width), instanceIndex.div(width));
    textureStore(image, coord, vec4(float(instanceIndex).add(0.25), 0, 0, 1)).toWriteOnly();
  })().compute(count, [8]));
  const consume = own(Fn(() => {
    const coord = uvec2(instanceIndex.mod(width), instanceIndex.div(width));
    values.element(instanceIndex).assign(textureLoad(image, coord).r);
  })().compute(count, [8]));
  await renderer.compileComputeAsync([produce, consume]);
  check('precompilation does not execute either kernel',
    Array.from(new Float32Array(await renderer.getArrayBufferAsync(output))), new Array(count).fill(0));
  renderer.compute([produce, consume]);
  check('textureStore then textureLoad preserves all float32 texels',
    Array.from(new Float32Array(await renderer.getArrayBufferAsync(output))), Array.from({length: count}, (_, i) => i + 0.25));

  // The material samples the compute-written StorageTexture itself. There is
  // deliberately no render-target copy, CPU download or texture upload here.
  const colorTexture = own(new THREE.StorageTexture(4, 4));
  const color = uniform(new THREE.Vector4(1, 0, 0, 1));
  const paint = own(Fn(() => {
    const coord = uvec2(instanceIndex.mod(4), instanceIndex.div(4));
    textureStore(colorTexture, coord, color).toWriteOnly();
  })().compute(16, [8]));
  const scene = new THREE.Scene();
  const geometry = own(new THREE.PlaneGeometry(2, 2));
  const material = own(new THREE.MeshBasicMaterial({map: colorTexture}));
  scene.add(new THREE.Mesh(geometry, material));
  const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 10);
  camera.position.z = 1;
  const target = own(new THREE.RenderTarget(8, 8, {depthBuffer: false}));
  renderer.setRenderTarget(target);
  await renderer.compileAsync(scene, camera);
  renderer.compute(paint);
  await renderer.renderAsync(scene, camera);
  check('ordinary material samples the compute-produced red texture',
    Array.from(await renderer.readRenderTargetPixelsAsync(target, 4, 4, 1, 1)), [255, 0, 0, 255]);
  color.value.set(0, 1, 0, 1);
  renderer.compute(paint);
  await renderer.renderAsync(scene, camera);
  check('later compute writes and mipmaps are visible without copying',
    Array.from(await renderer.readRenderTargetPixelsAsync(target, 4, 4, 1, 1)), [0, 255, 0, 255]);

  // Ordinary CanvasTexture uploads must remain call-time inputs even while a
  // new render is preparing asynchronously. Both readbacks join that FIFO.
  const canvas = document.createElement('canvas'); canvas.width = canvas.height = 2;
  const context = canvas.getContext('2d', {alpha: true, colorSpace: 'srgb'});
  const redGreenBlueWhite = [255, 0, 0, 255, 0, 255, 0, 255, 0, 0, 255, 255, 255, 255, 255, 255];
  const cyanYellowMagentaBlack = [0, 255, 255, 255, 255, 255, 0, 255, 255, 0, 255, 255, 0, 0, 0, 255];
  context.putImageData(new ImageData(new Uint8ClampedArray(redGreenBlueWhite), 2, 2), 0, 0);
  const encoded = canvas.toDataURL();
  const sampled = own(new THREE.CanvasTexture(canvas));
  sampled.minFilter = sampled.magFilter = THREE.NearestFilter; sampled.generateMipmaps = false;
  const sampledOutput = new THREE.StorageBufferAttribute(new Float32Array(16), 4);
  const sampledValues = storage(sampledOutput, 'vec4', 4);
  const sampleGain = uniform(1);
  const bias = new THREE.StorageBufferAttribute(new Float32Array(4), 1);
  const biasValues = storage(bias, 'float', 4);
  const sampleCanvas = own(Fn(() => {
    sampledValues.element(instanceIndex).assign(textureLoad(sampled, uvec2(instanceIndex.mod(2), instanceIndex.div(2)))
      .mul(sampleGain).add(vec4(biasValues.element(instanceIndex))));
  })().compute(4, [4]));
  const laterScene = new THREE.Scene();
  laterScene.add(new THREE.Mesh(geometry, own(new THREE.MeshBasicMaterial({color: 0x224466}))));
  renderer.render(laterScene, camera);
  renderer.compute(sampleCanvas); const firstCanvasRead = renderer.getArrayBufferAsync(sampledOutput);
  context.putImageData(new ImageData(new Uint8ClampedArray(cyanYellowMagentaBlack), 2, 2), 0, 0);
  sampled.needsUpdate = true;
  renderer.compute(sampleCanvas); const secondCanvasRead = renderer.getArrayBufferAsync(sampledOutput);
  canvas.width = canvas.height = 1; // neither earlier call may sample the cleared resized canvas
  const flipped = pixels => [...pixels.slice(8), ...pixels.slice(0, 8)].map(value => value / 255);
  check('queued CanvasTexture keeps the first call pixels and flipY',
    Array.from(new Float32Array(await firstCanvasRead)), flipped(redGreenBlueWhite));
  check('queued CanvasTexture keeps the later upload version across resize',
    Array.from(new Float32Array(await secondCanvasRead)), flipped(cyanYellowMagentaBlack));
  check('compute capture leaves the caller canvas resize intact', [canvas.width, canvas.height], [1, 1]);

  // TextureLoader's ready HTMLImageElement source uses the same capture path.
  const decoded = new Image(); decoded.src = encoded; await decoded.decode();
  decoded.width = decoded.height = 16; // CSS/display extent is not the texture extent
  sampled.image = decoded; sampled.needsUpdate = true;
  renderer.compute(sampleCanvas); const imageRead = renderer.getArrayBufferAsync(sampledOutput);
  decoded.removeAttribute('src'); sampleGain.value = 0;
  check('HTML image compute input retains intrinsic pixels after source replacement',
    Array.from(new Float32Array(await imageRead)), flipped(redGreenBlueWhite));

  // A raw RGBA PNG, rather than a canvas-encoded image, retains hidden RGB at
  // alpha zero and unpremultiplied values at alpha 1/255. Canvas rasterization
  // destroys these values even when the intermediate canvas uses float16.
  const translucentPixels = [179, 64, 38, 0, 179, 64, 38, 1, 179, 64, 38, 16, 50, 120, 200, 128];
  const translucentPng = 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAIAAAACCAYAAABytg0kAAAAFklEQVR4nGPY7KDGAMSMIELAqOJEAwAsvgVPkvA65gAAAABJRU5ErkJggg==';
  decoded.src = translucentPng; await decoded.decode();
  sampled.needsUpdate = true; sampleGain.value = .5;
  bias.array.fill(.125); bias.needsUpdate = true;
  renderer.compute(sampleCanvas); const translucentRead = renderer.getArrayBufferAsync(sampledOutput);
  decoded.removeAttribute('src'); sampleGain.value = 0; bias.array.fill(.75);
  check('delayed HTML pixels preserve hidden RGB and call-time uniforms and buffers',
    Array.from(new Float32Array(await translucentRead)), flipped(translucentPixels).map(value => value * .5 + .125));

  decoded.src = translucentPng; await decoded.decode();
  sampled.flipY = false; sampled.premultiplyAlpha = true; sampled.needsUpdate = true;
  sampleGain.value = 1; bias.array.fill(0); bias.needsUpdate = true;
  renderer.compute(sampleCanvas); const premultipliedRead = renderer.getArrayBufferAsync(sampledOutput);
  decoded.removeAttribute('src');
  const premultiplied = translucentPixels.map((value, i) => (i % 4 === 3 ? value
    : Math.round(value * translucentPixels[i - i % 4 + 3] / 255)) / 255);
  check('private HTML image bitmaps retain the original premultiplyAlpha and orientation flags',
    Array.from(new Float32Array(await premultipliedRead)), premultiplied);

  const wideCanvas = document.createElement('canvas'); wideCanvas.width = wideCanvas.height = 2;
  const wideContext = wideCanvas.getContext('2d', {colorSpace: 'display-p3'});
  if (wideContext.getContextAttributes().colorSpace !== 'display-p3') throw new Error('This fixture requires Display-P3 canvas support');
  wideContext.fillStyle = `color(display-p3 0.7 0.25 0.15 / ${16 / 255})`; wideContext.fillRect(0, 0, 2, 2);
  sampled.image = wideCanvas; sampled.premultiplyAlpha = false; sampled.needsUpdate = true;
  renderer.compute(sampleCanvas); const wideRead = renderer.getArrayBufferAsync(sampledOutput);
  wideCanvas.width = 1;
  check('translucent Display-P3 canvas input keeps the native sRGB upload values',
    Array.from(new Float32Array(await wideRead)), Array(4).fill([190, 52, 11, 16]).flat().map(value => value / 255));

  await renderer.waitForGPU();
  state.status = 'pass';
} catch (error) {
  state.status = 'fail'; state.error = error.stack ?? String(error);
} finally {
  for (const resource of resources.reverse()) resource.dispose();
  renderer?.dispose();
  document.querySelector('#result').textContent = JSON.stringify(state, null, 2);
}
</script></body></html>
