<!doctype html><html lang="en"><meta charset="utf-8"><title>Native storage pixel transfers</title>
<body><pre id="result">Running...</pre><script type="module">

import {withStorageTextureCopies} from '../../../tools/ingest/three_storage_texture_copy.mjs';
