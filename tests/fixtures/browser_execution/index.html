<!doctype html>
<meta charset="utf-8">
<title>FrankenThreeD real browser execution probe</title>
<h1>Asupersync browser execution</h1>
<p>This page loads one Rust/Wasm instance. Missing Wasm, errors, and timeouts fail.</p>
<pre id="result">Waiting for the Wasm program…</pre>
<script>
(() => {
  const omit = new URLSearchParams(location.search).get('omit');
  if (omit) {
    if (omit.includes('.')) {
      const [obj, prop] = omit.split('.');
      let val;
      Object.defineProperty(globalThis, obj, {
        configurable: true,
        enumerable: true,
        get: () => val,
        set: v => {
          val = v;
          if (val && typeof val === 'object') {
            try { delete val[prop]; } catch (_) {}
          }
        },
      });
    } else {
      const saved = globalThis[omit];
      try {
        delete globalThis[omit];
      } catch (_) {}
      window.__f3dOmitted = { name: omit, value: saved };
    }
    document.title += ` (omit=${omit})`;
  }
  const negative = new URLSearchParams(location.search).get('negative');
  if (negative) {
    // Negative run: the Rust probe disables one check by name and the run MUST fail.
    window.__f3dNegative = negative;
    document.title += ` (negative=${negative})`;
  }
})();
</script>
<script src="./shim.js"></script>
<script type="module">
if (window.__f3dOmitted && window.__f3dOmitted.value) {
  const { name, value } = window.__f3dOmitted;
  const origFinish = f3dHost.finish;
  f3dHost.finish = (passed, detail) => {
    globalThis[name] = value;
    origFinish(passed, detail);
  };
}
try {
  const wasm = await import('/pkg/f3d_runtime.js');
  await wasm.default();
  f3dHost.attach(wasm);
  wasm.start_probes();
} catch (error) {
  f3dHost.finish(false, String(error?.stack || error));
}
</script>
