<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>FrankenThreeD - WebGPU Bridge Verification</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 20px; background: #0e1117; color: #c9d1d9; }
    h1 { color: #58a6ff; font-size: 20px; }
    .status { margin-top: 15px; padding: 12px; border-radius: 6px; font-family: monospace; font-size: 13px; white-space: pre-wrap; }
    .pass { background: #163821; color: #7ee787; border: 1px solid #238636; }
    .fail { background: #3d1b1f; color: #ff7b72; border: 1px solid #da3633; }
    canvas { border: 1px solid #30363d; margin-top: 10px; image-rendering: pixelated; width: 128px; height: 128px; }
  </style>
</head>
<body>
  <h1>f3d-05.6: Actual First Frame through Rust/Wasm to WebGPU Bridge</h1>
  <canvas id="canvas" width="64" height="64"></canvas>
  <div id="output" class="status">Running bridge verification suite...</div>

  <script type="module">
    import init, {
      f3d_build_first_frame_packet,
      f3d_build_red_a_blue_b_packet,
      f3d_build_nested_viewport_scissor_packet,
      gpu_bridge_build_triangle_packet,
      gpu_bridge_build_red_blue_packet,
      gpu_bridge_build_nested_viewport_scissor_packet,
    } from "/pkg/f3d_runtime.js";
    import * as wasmExports from "/pkg/f3d_runtime.js";
    import {
      WebGpuBridgeHost,
      PACKET_MAGIC,
      PACKET_VERSION,
      TARGET_OFFSCREEN,
      TARGET_CANVAS,
    } from "./bridge_runtime.js";
    import { renderDirectReferenceTriangle } from "./direct_reference.js";
    import { testReadbackIdReuse } from "./readback_lifetime_test.js";
    import { testPipelineBindingChange } from "./pipeline_binding_test.js";
    import { testCanvasSubmissionLifetime } from "./canvas_lifetime_test.js";
    import { testDeviceReplacement } from "./device_lifetime_test.js";
    import { testViewportScissor } from "./viewport_scissor_test.js";
    import { testDrawParameters } from "./draw_parameters_test.js";
    import { testMeshScene, testVisibleCanvasMeshScene, testMeshDepthScene } from "./mesh_scene_test.js";
    import { testDepthScene } from "./depth_test.js";

    const outputEl = document.getElementById("output");
    const canvas = document.getElementById("canvas");
    const canvasContext = canvas.getContext("webgpu");

    const results = {
      passed: false,
      wasm_backed: false,
      tests: {},
      capabilityRecord: null,
      errors: [],
    };

    function logPass(name, detail = "") {
      results.tests[name] = { status: "PASS", detail };
      console.log(`[PASS] ${name}`, detail);
    }

    function logFail(name, error) {
      results.tests[name] = { status: "FAIL", error: error.message || String(error) };
      results.errors.push(`${name}: ${error.message || String(error)}`);
      console.error(`[FAIL] ${name}`, error);
    }

    async function runSuite() {
      try {
        await init();
        results.wasm_backed = true;
        logPass("wasm_runtime_linked", "Imported /pkg/f3d_runtime.js and initialized application Wasm");

        const buildTriangleFn = f3d_build_first_frame_packet || gpu_bridge_build_triangle_packet;
        const buildRedBlueFn = f3d_build_red_a_blue_b_packet || gpu_bridge_build_red_blue_packet;
        const buildViewportScissorFn = f3d_build_nested_viewport_scissor_packet || gpu_bridge_build_nested_viewport_scissor_packet;

        if (typeof buildTriangleFn !== "function" || typeof buildRedBlueFn !== "function" || typeof buildViewportScissorFn !== "function") {
          throw new Error("Missing required Wasm exports from /pkg/f3d_runtime.js");
        }

        const bridge = new WebGpuBridgeHost();

        // 1. Negotiation test: negative feature
        try {
          await bridge.negotiateAndCreateDevice({
            requiredFeatures: ["non-existent-feature-forbidden-xyz"],
          });
          logFail("negotiation_missing_feature", new Error("Expected negotiation to fail for non-existent feature"));
        } catch (e) {
          if (e.message.includes("Negotiation failed: required WebGPU feature")) {
            logPass("negotiation_missing_feature", e.message);
          } else {
            logFail("negotiation_missing_feature", e);
          }
        }

        // 1b. Negotiation test: excessive limit negative
        try {
          const excessiveBridge = new WebGpuBridgeHost();
          await excessiveBridge.negotiateAndCreateDevice({
            minLimits: { maxTextureDimension2D: 99999999 },
          });
          logFail("negotiation_excessive_limit", new Error("Expected negotiation to fail for excessive maxTextureDimension2D"));
        } catch (e) {
          if (e.message.includes("maxTextureDimension2D insufficient")) {
            logPass("negotiation_excessive_limit", e.message);
          } else {
            logFail("negotiation_excessive_limit", e);
          }
        }

        // 1c. Negotiation test: alignment mismatch negative
        try {
          const alignBridge = new WebGpuBridgeHost();
          await alignBridge.negotiateAndCreateDevice({
            minLimits: { minUniformBufferOffsetAlignment: 1 },
          });
          logFail("negotiation_alignment_mismatch", new Error("Expected negotiation to fail for alignment mismatch"));
        } catch (e) {
          if (e.message.includes("alignment mismatch")) {
            logPass("negotiation_alignment_mismatch", e.message);
          } else {
            logFail("negotiation_alignment_mismatch", e);
          }
        }

        // 2. Negotiation test: positive with fixture-selected target limits above defaults
        const preAdapter = await navigator.gpu.requestAdapter({ powerPreference: "high-performance" });
        if (!preAdapter) {
          throw new Error("Failed to acquire pre-adapter for limit inspection");
        }
        const targetTex = preAdapter.limits.maxTextureDimension2D >= 16384 ? 16384 : preAdapter.limits.maxTextureDimension2D;
        const targetBuf = preAdapter.limits.maxBufferSize >= 1073741824 ? 1073741824 : preAdapter.limits.maxBufferSize;

        const cap = await bridge.negotiateAndCreateDevice({
          requiredFeatures: [],
          minLimits: {
            maxTextureDimension2D: targetTex,
            maxBufferSize: targetBuf,
            minUniformBufferOffsetAlignment: 256,
          },
        });
        results.capabilityRecord = cap;
        logPass(
          "negotiation_positive",
          `Device negotiated on ${cap.adapter.vendor} (${cap.adapter.architecture}) with limits: maxTexture=${cap.limits.maxTextureDimension2D} (adapter: ${cap.adapterLimits.maxTextureDimension2D}), maxBuffer=${cap.limits.maxBufferSize} (adapter: ${cap.adapterLimits.maxBufferSize})`
        );

        canvasContext.configure({
          device: bridge.device,
          format: cap.preferredCanvasFormat,
          alphaMode: "premultiplied",
        });

        // 3. Error-scope discipline tests
        // A: Concurrent task interleaving prevention
        try {
          bridge.errorScopeActive = true;
          await bridge.withErrorScopes(["validation"], () => {});
          logFail("error_scope_concurrency", new Error("Expected interleaved error scope to be rejected"));
        } catch (e) {
          if (e.message.includes("Error-scope serialization violation")) {
            logPass("error_scope_concurrency", "Concurrent error-scope interleaving correctly rejected");
          } else {
            logFail("error_scope_concurrency", e);
          }
        } finally {
          bridge.errorScopeActive = false;
        }

        // B: Awaiting inside error-scope body detection
        try {
          await bridge.withErrorScopes(["validation"], async () => {
            await new Promise(r => setTimeout(r, 0));
          });
          logFail("error_scope_await_detection", new Error("Expected async body inside error scope to be rejected"));
        } catch (e) {
          if (e.message.includes("Awaits inside error-scope body are strictly forbidden")) {
            logPass("error_scope_await_detection", "Await inside error-scope body correctly rejected");
          } else {
            logFail("error_scope_await_detection", e);
          }
        }

        // 4. Parser boundary and validation rejection tests
        // A: Truncated fields
        try {
          const truncated = new Uint8Array([
            0x46, 0x33, 0x44, 0x50, // F3DP
            0x01, 0x00, // version 1
            0x00, 0x00, // flags 0
            0x01, 0x00, 0x00, 0x00, // 1 command
            0x00, 0x00, 0x00, 0x00, // 0 data len
            0x01, 0x00, // opcode 1 (CREATE_BUFFER, requires 12 bytes fields, but none provided!)
          ]);
          await bridge.executePacket(truncated);
          logFail("parser_truncated_fields_rejected", new Error("Expected truncated command fields to be rejected"));
        } catch (e) {
          if (e.message.includes("Truncated CREATE_BUFFER fields") || e.message.includes("cursor exceeded")) {
            logPass("parser_truncated_fields_rejected", e.message);
          } else {
            logFail("parser_truncated_fields_rejected", e);
          }
        }

        // B: Invalid format code rejection (texture formatCode and pipeline target formatCode)
        try {
          // 1. Invalid texture formatCode (opcode 6, 20 bytes fields)
          const invalidTextureFormat = new Uint8Array([
            0x46, 0x33, 0x44, 0x50, // F3DP magic
            0x01, 0x00, // version 1
            0x00, 0x00, // flags 0
            0x01, 0x00, 0x00, 0x00, // 1 command
            0x00, 0x00, 0x00, 0x00, // 0 data len
            0x06, 0x00, // opcode 6 (OPCODE_CREATE_TEXTURE)
            0x63, 0x00, 0x00, 0x00, // textureId 99
            0x40, 0x00, 0x00, 0x00, // width 64
            0x40, 0x00, 0x00, 0x00, // height 64
            0xe7, 0x03, 0x00, 0x00, // formatCode 999 (invalid!)
            0x10, 0x00, 0x00, 0x00, // usage 16
          ]);
          await bridge.executePacket(invalidTextureFormat);
          logFail("parser_invalid_format_rejected", new Error("Expected invalid texture format code to be rejected"));
        } catch (e) {
          if (!e.message.includes("Invalid texture formatCode")) {
            logFail("parser_invalid_format_rejected", e);
          } else {
            // 2. Invalid pipeline target formatCode (opcode 3, full 32 bytes fields with formatCode 999)
            try {
              const invalidPipelineFormat = new Uint8Array([
                0x46, 0x33, 0x44, 0x50, // F3DP magic
                0x01, 0x00, // version 1
                0x00, 0x00, // flags 0
                0x01, 0x00, 0x00, 0x00, // 1 command
                0x00, 0x00, 0x00, 0x00, // 0 data len
                0x03, 0x00, // opcode 3 (OPCODE_CREATE_PIPELINE)
                0x01, 0x00, 0x00, 0x00, // pipelineId 1
                0x00, 0x00, 0x00, 0x00, // codeOffset 0
                0x00, 0x00, 0x00, 0x00, // codeLen 0
                0xe7, 0x03, 0x00, 0x00, // formatCode 999 (invalid!)
                0x00, 0x00, 0x00, 0x00, // hasVB 0
                0x00, 0x00, 0x00, 0x00, // hasUniform 0
                0x00, 0x00, 0x00, 0x00, // uniformSize 0
                0x00, 0x00, 0x00, 0x00, // vertexStride 0
              ]);
              await bridge.executePacket(invalidPipelineFormat);
              logFail("parser_invalid_format_rejected", new Error("Expected invalid pipeline target format code to be rejected"));
            } catch (e2) {
              if (e2.message.includes("Invalid pipeline target formatCode")) {
                logPass("parser_invalid_format_rejected", "Both invalid texture formatCode (opcode 6) and pipeline formatCode (opcode 3) correctly rejected");
              } else {
                logFail("parser_invalid_format_rejected", e2);
              }
            }
          }
        }

        // 5. Positive First Frame: Triangle with AffineRows uniform from compiled Rust/Wasm
        const trianglePacket = buildTriangleFn();
        if (!(trianglePacket instanceof Uint8Array) || trianglePacket.byteLength === 0) {
          throw new Error("Rust Wasm triangle packet generator returned empty or non-Uint8Array packet");
        }

        await bridge.executePacket(trianglePacket, canvasContext);

        const bytesPerRow = 256;
        const bridgePixels = await bridge.readbackBuffer(20, bytesPerRow * 64);
        const directPixels = await renderDirectReferenceTriangle(bridge.device, 64, 64);

        if (bridgePixels.byteLength !== directPixels.byteLength) {
          throw new Error(`Length mismatch: bridge ${bridgePixels.byteLength} vs direct ${directPixels.byteLength}`);
        }

        let diffCount = 0;
        let nonZeroCount = 0;
        for (let i = 0; i < bridgePixels.byteLength; i++) {
          if (bridgePixels[i] !== 0) nonZeroCount++;
          if (bridgePixels[i] !== directPixels[i]) diffCount++;
        }

        if (nonZeroCount === 0) {
          throw new Error("Rendered image is completely empty/black");
        }
        if (diffCount > 0) {
          throw new Error(`Pixel mismatch between bridge and direct reference: ${diffCount} differences`);
        }

        logPass("first_frame_pixel_identical", `Bridge matches direct-JS reference across ${bridgePixels.byteLength} bytes (0 diffs, ${nonZeroCount} non-zero bytes)`);

        // 6. Red-A / Blue-B Snapshot Isolation in Single Queue Submission (using PerUseByteBuffer)
        const redBluePacket = buildRedBlueFn(true);
        if (!(redBluePacket instanceof Uint8Array) || redBluePacket.byteLength === 0) {
          throw new Error("Rust Wasm Red-A/Blue-B packet generator returned empty or non-Uint8Array packet");
        }

        await bridge.executePacket(redBluePacket, canvasContext);

        const pixelsA = await bridge.readbackBuffer(40, bytesPerRow * 64);
        const pixelsB = await bridge.readbackBuffer(41, bytesPerRow * 64);

        if (typeof pixelsA.epochHi === "number" && typeof pixelsA.epochLo === "number") {
          logPass("readback_epoch_propagation", `Readback stamped with epoch words (${pixelsA.epochHi}, ${pixelsA.epochLo})`);
        } else {
          throw new Error("ReadbackBuffer did not attach epochHi and epochLo to returned buffer");
        }

        const centerOffset = 32 * bytesPerRow + 32 * 4;
        const colorA = [pixelsA[centerOffset], pixelsA[centerOffset + 1], pixelsA[centerOffset + 2], pixelsA[centerOffset + 3]];
        const colorB = [pixelsB[centerOffset], pixelsB[centerOffset + 1], pixelsB[centerOffset + 2], pixelsB[centerOffset + 3]];

        if (colorA[0] > 200 && colorA[2] < 50 && colorB[2] > 200 && colorB[0] < 50) {
          logPass("red_a_blue_b_isolation", `Target A is Red (${colorA.join(",")}), Target B is Blue (${colorB.join(",")}) in same submission via PerUseByteBuffer`);
        } else {
          throw new Error(`Red-A/Blue-B snapshot violation: Target A was [${colorA}], Target B was [${colorB}]`);
        }

        // 6b. Negative Control: Single-slot unversioned reuse causes queue hazard detection
        const unversionedPacket = buildRedBlueFn(false);
        const hazardBridge = new WebGpuBridgeHost();
        await hazardBridge.negotiateAndCreateDevice({ requiredFeatures: [] });
        await hazardBridge.executePacket(unversionedPacket);
        const hazardPixelsA = await hazardBridge.readbackBuffer(40, bytesPerRow * 64);
        const hazardPixelsB = await hazardBridge.readbackBuffer(41, bytesPerRow * 64);
        const hazardColorA = [hazardPixelsA[centerOffset], hazardPixelsA[centerOffset + 1], hazardPixelsA[centerOffset + 2], hazardPixelsA[centerOffset + 3]];
        const hazardColorB = [hazardPixelsB[centerOffset], hazardPixelsB[centerOffset + 1], hazardPixelsB[centerOffset + 2], hazardPixelsB[centerOffset + 3]];

        const passedHazard = !(hazardColorA[0] > 200 && hazardColorA[2] < 50 && hazardColorB[2] > 200 && hazardColorB[0] < 50);
        if (passedHazard) {
          logPass("red_a_blue_b_hazard_detection", `Unversioned single-slot packet correctly fails isolation check (Target A=[${hazardColorA}], Target B=[${hazardColorB}]), proving hazard detection`);
        } else {
          throw new Error("Negative control failed: unversioned packet falsely passed snapshot isolation check");
        }

        logPass("readback_id_reuse_epoch", await testReadbackIdReuse(bridge));
        logPass("pipeline_layout_binding_change", await testPipelineBindingChange(bridge));
        logPass("canvas_multiple_submissions", await testCanvasSubmissionLifetime(bridge));
        logPass("device_replacement_and_loss", await testDeviceReplacement(buildRedBlueFn));
        logPass("viewport_scissor_rectangles", await testViewportScissor(bridge, buildViewportScissorFn));
        logPass("draw_ranges_and_instances", await testDrawParameters(bridge, wasmExports.f3d_build_draw_parameters_packet));
        logPass("dynamic_mesh_scene", await testMeshScene(bridge, wasmExports));

        const urlParams = new URLSearchParams(window.location.search);
        const requestedLane = urlParams.get("lane") || (urlParams.has("canvas") ? "canvas" : (urlParams.has("depth") ? "depth" : (urlParams.has("mesh_depth") ? "mesh_depth" : "offscreen")));

        if (requestedLane === "canvas" || requestedLane === "all") {
          const hasCanvasExport =
            typeof wasmExports.f3d_build_canvas_mesh_packet === "function" ||
            typeof wasmExports.gpu_bridge_build_canvas_mesh_packet === "function";
          if (!hasCanvasExport) {
            throw new Error(
              "Canvas lane requested, but Wasm module is missing required export f3d_build_canvas_mesh_packet / gpu_bridge_build_canvas_mesh_packet"
            );
          }
          logPass("visible_canvas_mesh_scene", await testVisibleCanvasMeshScene(bridge, wasmExports, canvasContext, canvas));
        }

        if (requestedLane === "depth" || requestedLane === "all") {
          const hasDepthExport =
            typeof wasmExports.f3d_build_overlapping_depth_packet === "function" ||
            typeof wasmExports.gpu_bridge_build_overlapping_depth_packet === "function";
          if (!hasDepthExport) {
            throw new Error(
              "Depth lane requested, but Wasm module is missing required export f3d_build_overlapping_depth_packet / gpu_bridge_build_overlapping_depth_packet"
            );
          }
          logPass("overlapping_depth_test", await testDepthScene(bridge, wasmExports));
        }

        if (requestedLane === "depth" || requestedLane === "mesh_depth" || requestedLane === "all") {
          const hasMeshDepthExport =
            typeof wasmExports.f3d_build_mesh_depth_packet === "function" ||
            typeof wasmExports.gpu_bridge_build_mesh_depth_packet === "function";
          if (!hasMeshDepthExport) {
            throw new Error(
              "Depth lane requested, but Wasm module is missing required export f3d_build_mesh_depth_packet / gpu_bridge_build_mesh_depth_packet"
            );
          }
          logPass("mesh_depth_scene", await testMeshDepthScene(bridge, wasmExports, canvasContext, canvas));
        }

        // 7. Retained renderer exclusion
        if (window.__threeRendererSubmissions && window.__threeRendererSubmissions > 0) {
          throw new Error("Retained renderer submission detected; all work must go through new WebGPU bridge");
        }
        logPass("no_retained_renderer", "Zero retained renderer calls; work issued exclusively through new WebGPU bridge");

        results.passed = results.errors.length === 0 && results.wasm_backed;
      } catch (err) {
        logFail("suite_execution", err);
        results.passed = false;
      }

      window.__f3dBridgeResults = results;

      if (results.passed) {
        outputEl.className = "status pass";
        outputEl.textContent = `ALL PASS: ${Object.keys(results.tests).length} tests verified (Wasm backed: ${results.wasm_backed}).\n` +
          JSON.stringify(results.tests, null, 2);
      } else {
        outputEl.className = "status fail";
        outputEl.textContent = `FAILED:\n` + results.errors.join("\n") + "\n\n" +
          JSON.stringify(results.tests, null, 2);
      }

      try {
        await fetch("/report", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(results),
        });
      } catch (e) {
        console.warn("Failed to post /report to test harness:", e);
      }
    }

    runSuite();
  </script>
</body>
</html>
