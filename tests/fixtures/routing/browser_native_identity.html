<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FrankenThreeD - Browser Native Identity Routing Fixture (f3d-04.4)</title>
  <style>
    body { font-family: monospace; padding: 20px; background: #111; color: #eee; }
    .pass { color: #4ade80; }
    .fail { color: #f87171; }
    canvas { border: 1px solid #444; margin: 4px; display: inline-block; width: 64px; height: 64px; }
  </style>
</head>
<body>
  <h1>FrankenThreeD - Renderer Construction Routing Fixture</h1>
  <p>Verifies real native GL context identity, WebGPU canvas acquisition, and canvas irreversibility.</p>
  <div id="output">Running verification...</div>

  <script type="module">
    import { runBrowserNativeIdentityVerification } from './browser_native_identity_fixture.mjs';

    window.__f3d_results__ = null;
    window.__f3d_decision_log__ = null;
    window.__f3d_attribution_log__ = null;

    let outcome;
    try {
      outcome = await runBrowserNativeIdentityVerification();
      window.__f3d_results__ = outcome;
      window.__f3d_decision_log__ = outcome.decision_log;
      window.__f3d_attribution_log__ = outcome.attribution_log;
      const outDiv = document.getElementById('output');
      outDiv.innerHTML = `<h2 class="${outcome.passed ? 'pass' : 'fail'}">${outcome.passed ? 'ALL PASSED' : 'VERIFICATION FAILED'}</h2><pre>${JSON.stringify(outcome.results, null, 2)}</pre>`;
    } catch (err) {
      outcome = { passed: false, error: err.message, stack: err.stack, results: [], decision_log: [], attribution_log: [] };
      window.__f3d_results__ = outcome;
      window.__f3d_decision_log__ = [];
      window.__f3d_attribution_log__ = [];
      const outDiv = document.getElementById('output');
      outDiv.innerHTML = `<h2 class="fail">ERROR</h2><pre>${err.stack || err.message}</pre>`;
    }

    try {
      await fetch('/report', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(outcome),
      });
    } catch (postErr) {
      console.warn('Failed to post /report to test harness:', postErr);
    }
  </script>
</body>
</html>
